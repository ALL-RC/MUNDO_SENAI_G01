<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro SENAI - Endereço</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo-container">
                <svg class="senai-logo" viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg">
                    <rect width="300" height="80" fill="#005C9E" rx="8"/>
                    <text x="150" y="52" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" text-anchor="middle" letter-spacing="4">SENAI</text>
                </svg>
            </div>
            <h1>Cadastro de Aluno - Cursos Técnicos</h1>
            <div class="step-indicator">Passo 2 de 3: Endereço</div>
        </header>

        <form id="form-pagina2" class="form-step" novalidate>
            <div class="form-group">
                <label for="cep">CEP *</label>
                <input type="text" id="cep" name="cep" maxlength="9" class="mask-cep" required placeholder="00000-000">
                <small class="help-text">O CEP será validado automaticamente no sistema dos Correios.</small>
            </div>

            <div class="form-group">
                <label for="logradouro">Logradouro *</label>
                <input type="text" id="logradouro" name="logradouro" maxlength="250" required placeholder="Rua, Avenida, Alameda...">
            </div>

            <div class="form-group">
                <label for="numero">Número da Casa *</label>
                <input type="text" id="numero" name="numero" maxlength="10" class="only-number" required placeholder="Ex: 123 ou S/N">
            </div>

            <div class="form-group">
                <label for="bairro">Bairro *</label>
                <input type="text" id="bairro" name="bairro" maxlength="250" required placeholder="Digite seu bairro">
            </div>

            <div class="form-group">
                <label for="cidade">Cidade *</label>
                <input type="text" id="cidade" name="cidade" maxlength="250" class="only-text" required placeholder="Digite sua cidade">
            </div>

            <div class="form-group">
                <label for="estado">Estado (UF) *</label>
                <input type="text" id="estado" name="estado" maxlength="2" class="only-text uppercase" required placeholder="Ex: SP">
            </div>

            <div class="form-group">
                <label for="complemento">Complemento (Opcional - Bloco, Apto, Condomínio)</label>
                <input type="text" id="complemento" name="complemento" maxlength="250" placeholder="Ex: Bloco B, Apto 42">
            </div>

            <div class="button-group">
                <a href="index.html" class="btn btn-secondary">&larr; Voltar</a>
                <button type="submit" class="btn btn-primary">Próximo (Curso) &rarr;</button>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
